<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RFS Hydrography Explorer</title>
<meta name="description" content="Explore the GEOGLOWS River Forecast System v3 hydrography. Select a river, take everything upstream of it, and export the reaches as an ID list or as GeoParquet."/>
<!-- Inline rather than a file: with no icon at all the browser requests /favicon.ico and logs a 404
     on every load, and a file would have to be referenced by a path that survives being served at
     the domain root, at /rfs-hydrography-explorer/, and under a PORTAL_BASE prefix. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1520'/%3E%3Cpath d='M7 25c4-1 5-5 9-6s5-5 9-6' fill='none' stroke='%234aa3df' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="map"></div>

<div id="sidebar">
  <header>
    <h1>&#9651; RFS HYDROGRAPHY EXPLORER</h1>
    <p>Click a river or enter a River ID. Everything upstream is selected, then export the list of
       river segment IDs.</p>
  </header>
  <div id="controls">
    <div class="field">
      <label>River ID (riverId)</label>
      <input id="input-id" type="text" placeholder="e.g. 620002797" spellcheck="false" inputmode="numeric"/>
    </div>
    <div class="btn-row">
      <button id="btn-download" disabled>Download list</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div class="btn-row">
      <button id="btn-copy" disabled>Copy to clipboard</button>
    </div>
    <div class="btn-row">
      <button id="btn-geoparquet" disabled>Download GeoParquet</button>
    </div>
  </div>

  <!-- The selection box, the progress block and one status line, in place of a running log. -->
  <div id="selection-info"></div>

  <div id="progress">
    <div id="progress-head">
      <span id="progress-phase"></span>
      <span id="progress-pct"></span>
    </div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-detail"></div>
  </div>

  <div id="status"></div>
</div>

<div id="panel-right">
  <div class="card">
    <h2>Layers</h2>
    <div class="legend-item">
      <input type="checkbox" id="toggle-group" checked/>
      <label for="toggle-group">Group boundaries</label>
      <span class="swatch poly"></span>
    </div>
    <div class="legend-item"><span class="swatch stream"></span> Stream network</div>
    <div class="legend-item"><span class="swatch upstream"></span> Upstream of selection</div>
    <div class="legend-item"><span class="swatch outlet"></span> Selected outlet</div>
  </div>
  <div class="card">
    <h2>Group under cursor</h2>
    <div id="group-readout"><span class="hint">Hover the map.</span></div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
