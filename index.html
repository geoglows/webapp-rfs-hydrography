<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RFS Hydrography Explorer</title>
<meta name="description" content="Explore the GEOGLOWS River Forecast System v3 hydrography. Select a river, take everything upstream of it, export the reaches as an ID list or as GeoParquet, and style the network by attribute and zoom."/>
<!-- A stream network as the thing it is: a tree of straight segments, drawn with the trunk thicker
     than the branches and the branches thicker than the headwaters — Strahler order, at 16px. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1520'/%3E%3Cg fill='none' stroke='%234A90E2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 28.5V18' stroke-width='4'/%3E%3Cpath d='M16 18L8.5 11.5M16 18L23.5 11.5' stroke-width='2.9'/%3E%3Cpath d='M8.5 11.5L4.5 6M8.5 11.5L10.5 4.5M23.5 11.5L21.5 4.5M23.5 11.5L27.5 6' stroke-width='1.9'/%3E%3C/g%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="map"></div>

<div id="sidebar">
  <header>
    <h1>RFS HYDROGRAPHY EXPLORER</h1>
    <p>Click a river or enter a River ID. Everything upstream is selected, then export the list of river segment IDs.</p>
  </header>
  <div id="controls">
    <div class="field">
      <label for="input-id">River ID (riverId)</label>
      <input id="input-id" type="text" placeholder="e.g. 620002797" spellcheck="false" inputmode="numeric"/>
    </div>
    <div class="btn-row">
      <button id="btn-download" disabled>Download list</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div class="btn-row">
      <button id="btn-copy" disabled>Copy IDs to clipboard</button>
    </div>
    <div class="btn-row">
      <button id="btn-geoparquet" disabled>Download GeoParquet</button>
    </div>
  </div>

  <!-- The selection box, the progress block and one status line, in place of a running log. -->
  <div id="selection-info"></div>

  <div id="progress">
    <div id="progress-head">
      <span id="progress-phase"></span>
      <span id="progress-pct"></span>
    </div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-detail"></div>
  </div>

  <!-- The staged progress block: one bar per kind of work, one line per phase. Built by ui.js from
       the plan the GeoParquet export declares before it starts. -->
  <div id="stages"></div>

  <div id="status"></div>
</div>

<div id="panel-right">
  <div class="card">
    <h2>Layers</h2>
    <div class="legend-item">
      <input type="checkbox" id="toggle-group" checked/>
      <label for="toggle-group">Group boundaries</label>
      <span class="swatch poly"></span>
    </div>
    <div class="legend-item"><span class="swatch stream"></span> Stream network</div>
    <div class="legend-item"><span class="swatch upstream"></span> Upstream of selection</div>
    <div class="legend-item"><span class="swatch outlet"></span> Selected outlet</div>
  </div>
  <div class="card">
    <h2>Group under cursor</h2>
    <div id="group-readout"><span class="hint">Hover the map.</span></div>
  </div>

  <div class="card" id="style-card">
    <h2>
      <span>Stream styling</span>
      <span id="style-zoom" title="Current map zoom — every stop below sits on a half-zoom step">z2.0</span>
      <button id="style-collapse" title="Collapse the styling panel">&#9662;</button>
    </h2>
    <div id="style-body"></div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
