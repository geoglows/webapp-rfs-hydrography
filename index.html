<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>RFS Hydrography Explorer</title>
  <meta content="Explore the GEOGLOWS River Forecast System v3 hydrography. Click a river, take everything upstream of it, export the reaches and their catchments as GeoParquet, and style the network by attribute and zoom." name="description"/>
  <link href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1520'/%3E%3Cg fill='none' stroke='%234A90E2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 28.5V18' stroke-width='4'/%3E%3Cpath d='M16 18L8.5 11.5M16 18L23.5 11.5' stroke-width='2.9'/%3E%3Cpath d='M8.5 11.5L4.5 6M8.5 11.5L10.5 4.5M23.5 11.5L21.5 4.5M23.5 11.5L27.5 6' stroke-width='1.9'/%3E%3C/g%3E%3C/svg%3E" rel="icon"/>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="map"></div>

<div id="sidebar">
  <header>
    <h1>RFS HYDROGRAPHY EXPLORER</h1>
    <p>Click a river. Everything upstream is selected, then export it as GeoParquet.</p>
  </header>
  <div id="controls">
    <h2>Layers</h2>
    <div id="layer-toggles">
      <div class="legend-item">
        <input data-layers="group-fill group-line" id="toggle-group" type="checkbox"/>
        <label for="toggle-group">Group boundaries</label>
        <span class="swatch poly"></span>
      </div>
      <div class="legend-item">
        <input data-layers="catchment-fill catchment-outlet catchment-line" id="toggle-catchments" type="checkbox"/>
        <label for="toggle-catchments" title="The land draining to each reach. Merged into basins below z10; one polygon per reach, and coloured with the selection, from z10 up.">Catchments</label>
        <span class="swatch catchment"></span>
      </div>
    </div>
    <div class="legend-item"><span class="swatch stream"></span> Stream network</div>
    <div class="legend-item"><span class="swatch upstream"></span> Upstream of selection</div>
    <div class="legend-item"><span class="swatch outlet"></span> Selected outlet</div>

    <div class="btn-row">
      <button disabled id="btn-geoparquet"
              title="Saves two GeoParquet files: the selected reaches, then the catchment polygon each of them drains.">
        Download GeoParquet
      </button>
      <button id="btn-clear">Clear</button>
    </div>
  </div>

  <div id="selection-info"></div>

  <div id="progress">
    <div id="progress-head">
      <span id="progress-phase"></span>
      <span id="progress-pct"></span>
    </div>
    <div id="progress-bar">
      <div id="progress-fill"></div>
    </div>
    <div id="progress-detail"></div>
  </div>
  <div id="stages"></div>
  <div id="status"></div>
</div>

<div id="panel-right">
  <div class="card" id="style-card">
    <h2>
      <span>Stream styling</span>
      <span id="style-zoom" title="Current map zoom — every stop below sits on a half-zoom step">z2.0</span>
      <button id="style-collapse" title="Collapse the styling panel">&#9662;</button>
    </h2>
    <div id="style-body"></div>
  </div>
</div>
<script src="/src/main.js" type="module"></script>
</body>
</html>
